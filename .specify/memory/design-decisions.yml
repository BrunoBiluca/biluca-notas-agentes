schema_version: '1.0'
decisions:
- capability: notes collection toolbar with view, sorting, and search
  aliases:
  - top navigation actions and centered search
  - toolbar
  - toggle between grid and list
  - button toggle
  - sort order icon button
  - icon button
  - search text input
  - form field
  - grid list switch and order button
  resolution: compose-components
  decision: MatToolbar composed with MatButtonToggleGroup, matIconButton, MatFormField, and MatInput;
    view and sort controls on the left with centered search
  components:
  - MatToolbar
  - MatButtonToggleGroup
  - matIconButton
  - MatFormField
  - MatInput
  constraints:
    tokens:
    - color.surface
    - color.on-surface
    - typography.body-medium
    - shape.corner-full
    states:
    - default
    - hover
    - focus
    - disabled
    - loading
    - error
    responsive: reflow without clipping
    accessibility:
    - semantic controls
    - keyboard operable
    - visible focus
    - accessible names
    interaction: view toggle, sort mode, centered search
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 001-gerenciar-notas
  id: dd-001
  status: active
  decided_on: '2026-10-29'
- capability: note creation form
  aliases:
  - create or edit a note form
  - form field
  resolution: compose-components
  decision: MatFormField with MatInput for note fields and matIconButton for icon-only actions
  components:
  - MatFormField
  - MatInput
  - matIconButton
  constraints:
    tokens:
    - color.outline
    - color.on-surface
    - typography.body-medium
    - shape.corner-small
    states:
    - default
    - focus
    - disabled
    - loading
    - error
    responsive: reflow without clipping
    accessibility:
    - semantic controls
    - keyboard operable
    - visible focus
    - accessible names
    interaction: form placed immediately below toolbar
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 001-gerenciar-notas
  id: dd-002
  status: active
  decided_on: '2026-10-29'
- capability: note cards and manual reorder interaction
  aliases:
  - note card with images and hover actions
  - note image card drag surface
  - note summary tile with media and actions
  - notes collection layout
  - pinned notes card collection layout
  resolution: compose-components
  decision: MatCard with full-width mat-card-image and matIconButton actions; apply feature-specific background/hover
    styling and CDK drag behavior to the full card, with keyboard alternative
  components:
  - MatCard
  - mat-card-image
  - matIconButton
  - CdkDrag
  - CdkDropList
  rejected:
  - candidate: button-toggle
    reason: selection control, not a note content surface
  - candidate: form-field
    reason: input control, not a note content surface
  constraints:
    tokens:
    - color.surface
    - color.surface-container
    - color.on-surface
    - typography.title-medium
    - typography.body-medium
    - shape.corner-medium
    states:
    - default
    - hover
    - focus
    - active
    - loading
    - error
    - empty
    responsive: grid reflows; list remains usable
    accessibility:
    - accessible icon names
    - pointer/touch/keyboard
    - no color-only meaning
    interaction: drag begins anywhere on card
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 001-gerenciar-notas
  id: dd-003
  status: active
  decided_on: '2026-10-29'
- capability: note detail modal
  aliases:
  - modal dialog for note details
  - modal detail view
  - note details overlay
  - note detail popup dialog
  - note details overlay presentation
  - MatDialog
  resolution: reuse
  decision: MatDialog with accessible title, Escape and visible close action, and focus restoration to
    the trigger
  components:
  - MatDialog
  constraints:
    tokens:
    - color.surface
    - color.on-surface
    - typography.title-medium
    - typography.body-medium
    - shape.corner-large
    states:
    - open
    - focus
    - loading
    - error
    - closed
    responsive: dialog content reflows
    accessibility:
    - keyboard operable
    - accessible title
    - dismissible focus containment
    - focus restoration
    interaction: modal detail opened from note card
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 001-gerenciar-notas
  id: dd-004
  status: active
  decided_on: '2026-10-29'
- capability: note collection and operation feedback
  aliases:
  - empty and error feedback for note collection
  - empty state and operation failure message
  resolution: compose-components
  decision: semantic status and error text with Material form-field validation and local SVG icons for
    recovery actions
  components:
  - MatFormField
  - MatIcon
  - matIconButton
  constraints:
    tokens:
    - color.on-surface
    - color.primary
    - typography.body-medium
    states:
    - loading
    - empty
    - no-results
    - error
    - conflict
    responsive: messages reflow without clipping
    accessibility:
    - status announced
    - error described in text
    - no color-only meaning
    interaction: actionable next step where applicable
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 001-gerenciar-notas
  id: dd-005
  status: active
  decided_on: '2026-10-29'
- capability: note color selection and image attachment controls
  aliases:
  - select color for note background
  - color picker
  - file selection upload images
  - image attachment file picker
  - note color selection control
  - color input control pattern
  - image attachment upload flow
  - image upload with file validation
  resolution: compose-components
  decision: Use native color and file inputs with labeled controls and the existing Material icon button
    for image removal; do not create a local abstraction.
  components:
  - HTMLInputElement[type=color]
  - HTMLInputElement[type=file]
  - matIconButton
  rejected:
  - candidate: MatFormField/MatInput
    reason: Text-field components do not provide the native color and file selection controls.
  - candidate: Inventory patterns
    reason: No color-selection or image-upload pattern is registered.
  constraints:
    tokens:
    - color.primary
    - color.on-surface
    states:
    - default
    - focus
    - error
    responsive: reflow without clipping
    accessibility:
    - semantic labels
    - keyboard operable
    - accessible names
    interaction: choose note color or image; allow image removal
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 001-gerenciar-notas
  id: dd-006
  status: active
  decided_on: '2026-10-29'
- capability: note deletion confirmation using browser native dialog
  aliases:
  - confirmation before deleting a note
  - confirm deletion dialog
  - native confirmation dialog
  resolution: reuse
  decision: Use the browser-native confirmation and keep the note unchanged when the user cancels.
  components:
  - window.confirm
  constraints:
    tokens: []
    states:
    - confirm
    - cancel
    responsive: handled by browser
    accessibility:
    - native keyboard-operable confirmation
    interaction: confirm or cancel note deletion
  design_system: browser-platform
  decided_in: 001-gerenciar-notas
  id: dd-007
  status: active
  decided_on: '2026-10-29'
- capability: search box visual appearance
  aliases:
  - search box visual appearance
  - toolbar search input field
  - search text input
  - form field for text entry
  - toolbar text search control
  resolution: compose-components
  decision: Reuse MatFormField with appearance=outline and MatInput, compose a leading MatIcon in color.primary,
    use color.surface-container background and shape.corner-extra-small radius. Match the documented icon-button/button-toggle
    height; remove the resting border while preserving a visible focus treatment.
  components:
  - MatFormField
  - MatInput
  - MatIcon
  constraints:
    tokens:
    - color.surface-container
    - color.primary
    - color.on-surface
    - typography.body-medium
    - shape.corner-extra-small
    states:
    - default
    - hover
    - focus
    - disabled
    - loading
    - error
    responsive: keep centered in wide toolbar and full-width below toolbar controls on narrow viewports
    accessibility:
    - semantic search input
    - keyboard operable
    - visible focus
    - accessible name
    interaction: search icon precedes input and field remains visually prominent
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 001-gerenciar-notas
  id: dd-008
  status: active
  decided_on: '2026-10-29'
- capability: theme menu in navigation toolbar
  aliases:
  - theme selector
  - menu
  - dropdown menu theme options
  resolution: compose-components
  decision: MatToolbar with a right-aligned MatIconButton opens MatMenu containing three MatMenuItem choices;
    use the existing MatIcon SVG registry for its glyph and mark the current choice in text.
  components:
  - MatToolbar
  - MatIconButton
  - MatIcon
  - MatMenu
  - MatMenuItem
  rejected:
  - candidate: MatButtonToggleGroup
    reason: Segmented toggle does not match the requested dropdown menu.
  - candidate: MatFormField
    reason: A form field is not an action or choice menu.
  constraints:
    tokens:
    - color.surface
    - color.on-surface
    - color.primary
    - color.on-primary
    - color.outline
    states:
    - closed
    - open
    - focus
    - selected
    - disabled
    - persistence-error
    responsive: Keep the toolbar trigger and menu visible without clipping at narrow viewports; no named
      breakpoints are published.
    accessibility:
    - accessible trigger name
    - keyboard navigation
    - focus restoration
    - selected state expressed in text
    interaction: The icon button opens the menu; choosing one of the three items applies that option. A storage
      failure leaves the choice active for the session and is announced without claiming it was saved.
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 002-temas-visuais
  id: dd-009
  status: active
  decided_on: '2026-11-05'
- capability: application light and dark color scheme
  aliases:
  - appearance preference
  - color scheme
  - light and dark color scheme
  - theme toggle
  resolution: compose-pattern
  decision: Use Angular Material's documented light/dark color-scheme pattern with the existing Azure
    palette; the selected mode sets light, dark, or system-following light dark color-scheme.
  components:
  - mat.theme
  - color-scheme
  - Azure palette
  rejected:
  - candidate: third-party themes
    reason: Explicitly outside the feature scope.
  - candidate: note-specific colors as the application theme
    reason: Note background colors remain per-note data and must not replace the global color scheme.
  constraints:
    tokens:
    - color.surface
    - color.on-surface
    - color.surface-container
    - color.primary
    - color.on-primary
    - color.outline
    - color.error
    states:
    - light
    - dark
    - system
    responsive: Inherit current application reflow; no named design-system breakpoints are published.
    accessibility:
    - contrast in light and dark schemes
    - preserve legibility of notes with their own backgrounds
    interaction: Explicit mode selects one color scheme; system mode follows the device preference.
  design_system: angular-material-m3
  design_system_version: 22.2.5
  decided_in: 002-temas-visuais
  id: dd-010
  status: active
  decided_on: '2026-11-05'
